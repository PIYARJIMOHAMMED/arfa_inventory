{% block styles %}
<style>
    body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h2 {
        color: #dc3545;
        text-align: center;
        margin-bottom: 25px;
    }

    form {
        max-width: 900px;
        margin: 0 auto;
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
    }

    thead th {
        background-color: #007BFF;
        color: white;
        padding: 12px;
        text-align: left;
    }

    tbody td {
        padding: 12px;
        border-bottom: 1px solid #e0e0e0;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    input[type="number"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        transition: border-color 0.3s;
    }

    input[type="number"]:focus {
        border-color: #007BFF;
        outline: none;
    }

    button[type="submit"] {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        display: block;
        margin: 20px auto 0;
        transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
        background-color: #218838;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        form {
            padding: 15px;
        }
        
        thead th, tbody td {
            padding: 8px;
            font-size: 14px;
        }
    }

    @media (max-width: 576px) {
        body {
            padding: 10px;
        }
        
        h2 {
            font-size: 1.5em;
        }
        
        table {
            display: block;
            overflow-x: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h2>Close Day - Enter Closing Stock</h2>

    <form method="post" action="{% url 'close_day' %}">
        {% csrf_token %}
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Opening Stock</th>
                    <th>Closing Stock (Enter)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.current_stock }}</td>
                    <td>
                        <input type="number" step="0.01" name="closing_stock_{{ item.id }}" required>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit">Done</button>
    </form>
</div>
{% endblock %}
