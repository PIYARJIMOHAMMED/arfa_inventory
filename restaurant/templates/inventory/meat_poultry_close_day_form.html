{% block styles %}
<style>
    body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h2 {
        color: #dc3545;
        text-align: center;
        margin-bottom: 25px;
        padding-top: 20px;
    }

    form {
        max-width: 900px;
        margin: 0 auto;
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
    }

    .table th,
    .table td {
        padding: 12px;
        border-bottom: 1px solid #dee2e6;
    }

    .table thead th {
        background-color: #007BFF;
        color: white;
        vertical-align: middle;
        border-bottom: 2px solid #0056b3;
    }

    .table tbody tr:hover {
        background-color: rgba(0, 123, 255, 0.05);
    }

    input[type="number"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        transition: all 0.3s;
    }

    input[type="number"]:focus {
        border-color: #007BFF;
        outline: none;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .btn-primary {
        background-color: #007BFF;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        display: block;
        margin: 20px auto 0;
        transition: all 0.3s;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        form {
            padding: 15px;
        }
        
        .table th,
        .table td {
            padding: 8px;
            font-size: 14px;
        }
    }

    @media (max-width: 576px) {
        body {
            padding: 10px;
        }
        
        h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        
        .table {
            display: block;
            overflow-x: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h2>Close Day - Enter Closing Stock (Meat & Poultry)</h2>
    
    <form method="post">
        {% csrf_token %}
        <table class="table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Opening Stock</th>
                    <th>Closing Stock (Enter)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.current_stock }}</td>
                    <td>
                        <input type="number" name="closing_stock_{{ item.id }}" step="0.01" min="0" required>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <button type="submit" class="btn btn-primary">Done</button>
    </form>
</div>
{% endblock %}
