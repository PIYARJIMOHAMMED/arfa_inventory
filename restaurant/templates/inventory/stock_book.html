<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 960px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 40px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 2.8rem;
      color: #222;
      margin-bottom: 30px;
      user-select: none;
    }

    .total-info {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 50px;
      color: #555;
    }

    .links-group {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .add-link {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white !important;
      padding: 14px 30px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 12px rgba(0, 123, 255, 0.35);
      transition: all 0.3s ease;
      min-width: 160px;
      user-select: none;
    }

    .add-link:hover,
    .add-link:focus {
      background: linear-gradient(135deg, #0056b3, #003f7f);
      box-shadow: 0 8px 20px rgba(0, 86, 179, 0.6);
      transform: translateY(-3px);
      outline: none;
    }

    @media (max-width: 700px) {
      .add-link {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1>Stock Dashboard</h1>

    <div class="total-info" aria-live="polite" aria-atomic="true">
      <p><strong>Total Items:</strong> {{ total_items }}</p>
    </div>

    <nav class="links-group" aria-label="Stock storage navigation">
      <a href="{% url 'stock_room' %}" class="add-link">Stock Room</a>
      <a href="{% url 'cold_storage' %}" class="add-link">Cold Storage</a>
      <a href="{% url 'meat_poultry_room' %}" class="add-link">Meat & Poultry</a>
    </nav>
  </div>
</body>
</html>
