{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard - Cafe Arfa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-blue: #3498db;
            --success-green: #2ecc71;
            --warning-orange: #f39c12;
            --danger-red: #e74c3c;
            --dark-gray: #2c3e50;
            --light-gray: #ecf0f1;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 15px;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .dashboard-header h2 {
            color: var(--dark-gray);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 2rem;
        }
        .action-btn {
            padding: 1.5rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: none;
            color: white;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin: 2rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--dark-gray);
        }
        .btn-vendor {
            background: linear-gradient(135deg, var(--primary-blue), #2980b9);
        }
        .btn-raw {
            background: linear-gradient(135deg, var(--success-green), #27ae60);
        }
        .btn-purchase {
            background: linear-gradient(135deg, var(--warning-orange), #d35400);
        }
        .btn-stock {
            background: linear-gradient(135deg, var(--danger-red), #c0392b);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-critical { background-color: var(--danger-red); }
        .status-warning { background-color: var(--warning-orange); }
        .status-good { background-color: var(--success-green); }
        @media (max-width: 768px) {
            .action-btn {
                padding: 1.2rem;
                font-size: 1rem;
            }
            .chart-container {
                padding: 1rem;
            }
        }
        @media (max-width: 576px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
            .action-btn {
                padding: 1rem;
            }
            .dashboard-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>📊 Inventory Control Center</h2>
            <p class="text-muted">Centralized management for all inventory operations</p>
        </div>

        <!-- Primary Action Buttons -->
        <div class="action-grid">
            <button onclick="window.location.href='/vendor/'" class="action-btn btn-vendor">
                <span>👥</span> Vendor Management
            </button>
            <button onclick="window.location.href='/raw-materials/'" class="action-btn btn-raw">
                <span>🌿</span> Raw Materials
            </button>
            <button onclick="window.location.href='/purchase-history/'" class="action-btn btn-purchase">
                <span>🛒</span> Purchases
            </button>
            <button onclick="window.location.href='/stock-book/'" class="action-btn btn-stock">
                <span>📘</span> Stock Book
            </button>
        </div>

        <!-- Critical Items Table -->
        <div class="chart-container">
            <h3 class="chart-title">🚨 Critical Inventory Items</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Current Stock</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Sugar</td>
                            <td>Pantry</td>
                            <td>12 kg</td>
                            <td><span class="status-indicator status-critical"></span> Critical</td>
                        </tr>
                        <tr>
                            <td>Coffee Beans</td>
                            <td>Beverage</td>
                            <td>5 kg</td>
                            <td><span class="status-indicator status-warning"></span> Low</td>
                        </tr>
                        <tr>
                            <td>Milk</td>
                            <td>Dairy</td>
                            <td>30 L</td>
                            <td><span class="status-indicator status-good"></span> Good</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
